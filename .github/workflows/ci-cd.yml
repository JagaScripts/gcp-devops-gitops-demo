name: CI/CD Pipeline - GCP Always Free & GitOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.9.8"
  GCP_REGION: "us-central1"
  AR_REPO: "devops-demo-images"
  SERVICE_NAME: "gcp-devops-demo"

jobs:
  python-tests:
    name: Python Unit Tests & Audit CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest suite
        run: pytest -v

      - name: Audit Terraform variables and YAML manifests
        run: |
          python scripts/audit_cli.py \
            --terraform-dir terraform \
            --yaml-dir gitops \
            --yaml-dir .github/workflows

  terraform-validate:
    name: Terraform Format & Static Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate root Terraform module
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Validate Cloud Run module
        run: |
          terraform -chdir=terraform/modules/cloud-run init -backend=false -input=false
          terraform -chdir=terraform/modules/cloud-run validate

      - name: Validate GKE Autopilot + VPC blueprint module (static only)
        run: |
          terraform -chdir=terraform/modules/gke-vpc init -backend=false -input=false
          terraform -chdir=terraform/modules/gke-vpc validate

  docker-smoke-test:
    name: Docker Non-Root Build & Health Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build multi-stage Docker image
        run: docker build -t gcp-devops-demo:ci .

      - name: Verify non-root execution and /health HTTP 200
        run: |
          docker run -d --rm -p 127.0.0.1:8080:8080 --name demo-ci gcp-devops-demo:ci
          trap 'docker rm -f demo-ci || true' EXIT
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          UID_VAL=$(docker exec demo-ci id -u)
          test "$UID_VAL" -ne 0
          curl -fsS http://127.0.0.1:8080/health | grep -q '"status": "ok"'

  deploy-cloud-run:
    name: Build, Push to Artifact Registry & Deploy Cloud Run
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - terraform-validate
      - docker-smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push container image
        env:
          IMAGE_URI: "${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
        run: |
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run (Always Free)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: "${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          flags: "--allow-unauthenticated --min-instances=0 --max-instances=2 --memory=256Mi --cpu=1"

      - name: Verify live Cloud Run /health endpoint
        run: |
          python -m pip install PyYAML
          python scripts/audit_cli.py --health-url "${{ steps.deploy.outputs.url }}/health"
